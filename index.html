<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Finance Voice Bridge</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);background:#fff;border:1px solid #d9e0e8;border-radius:16px;box-shadow:0 18px 45px rgba(16,24,40,.12);overflow:hidden}.head{padding:17px 18px 14px;border-bottom:1px solid #e6ebf0}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:#667085;font-size:11px;letter-spacing:.04em}.body{padding:18px}.status{padding:10px 12px;border-radius:10px;background:#eef5fb;color:#1f4566;font-size:12px;font-weight:700;margin-bottom:14px}.mic{width:92px;height:92px;border-radius:50%;border:0;background:#1f4566;color:#fff;font-size:34px;display:block;margin:20px auto 12px;cursor:pointer;box-shadow:0 8px 24px rgba(31,69,102,.25)}.mic.listening{background:#b8402a;animation:pulse 1.15s infinite}.mic:disabled{opacity:.45;cursor:not-allowed}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(184,64,42,.10)}}.primary{width:100%;border:0;border-radius:9px;background:#1f4566;color:#fff;padding:11px 14px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5}.hint{text-align:center;color:#667085;font-size:12px;line-height:1.5;min-height:38px}.transcript{margin-top:14px;padding:12px;border:1px solid #e4e8ee;border-radius:10px;background:#fafbfc;min-height:62px;font-size:13px;color:#344054;line-height:1.45}.foot{padding:11px 18px;border-top:1px solid #e6ebf0;color:#667085;font-size:10.5px}.ok{color:#087a55}.bad{color:#b42318}
</style>
</head>
<body>
<div class="card">
  <div class="head"><b>Trade Finance Voice Bridge</b><small>MICROPHONE FOR GEMINI ASSISTANT</small></div>
  <div class="body">
    <div id="status" class="status">Connecting to Trade Finance…</div>
    <button id="mic" class="mic" type="button" aria-label="Enable or stop voice">🎙️</button>
    <button id="enable" class="primary" type="button">Enable voice</button>
    <div id="hint" class="hint">Keep this small window open while using the Gemini assistant.</div>
    <div id="transcript" class="transcript">No speech yet.</div>
  </div>
  <div class="foot">Your voice is used only for the active Trade Finance assistant session.</div>
</div>
<script>
(function(){
'use strict';
const q=new URLSearchParams(location.search), token=q.get('tfVoiceToken')||'', lang=q.get('lang')||'en-IN';
const statusEl=document.getElementById('status'), hintEl=document.getElementById('hint'), transcriptEl=document.getElementById('transcript'), mic=document.getElementById('mic'), enable=document.getElementById('enable');
let armed=false,listening=false,mediaRecorder=null,stream=null,chunks=[],audioCtx=null,analyser=null,raf=0;
let speechSeen=false,lastSound=0,started=0,stopTimer=0,hasLevel=false;

function post(type,extra){try{if(window.opener&&!window.opener.closed)window.opener.postMessage(Object.assign({type,token},extra||{}),'*');}catch(e){}}
function setStatus(t,cls){statusEl.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
function setListening(on){
  listening=!!on;
  mic.classList.toggle('listening',listening);
  mic.textContent=listening?'■':'🎙️';
  enable.textContent=armed?(listening?'Stop listening':'Voice enabled'):'Enable voice';
  enable.disabled=false;
}
function errMessage(e){
  const code=String(e?.error||e?.name||'');const msg=String(e?.message||'');const all=code+' '+msg;
  if(/not-allowed|permission|NotAllowed/i.test(all))return 'Microphone permission was denied. Allow microphone access for this Voice Bridge page and reload it.';
  if(/notfound|devicesnotfound/i.test(all))return 'No microphone was found. Check the selected Windows/Chrome input device.';
  if(/notreadable|trackstart|could not start/i.test(all))return 'Chrome can see the microphone but cannot open it. Close other apps using the mic and try again.';
  if(/overconstrained/i.test(all))return 'The selected microphone does not support the requested audio settings.';
  return (code?code+': ':'')+(msg||'Voice capture failed.');
}
function mediaMime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  if(!window.MediaRecorder)return '';
  if(!MediaRecorder.isTypeSupported)return '';
  return c.find(x=>MediaRecorder.isTypeSupported(x))||'';
}
function stopTracks(){
  clearTimeout(stopTimer);cancelAnimationFrame(raf);
  try{stream?.getTracks().forEach(t=>t.stop());}catch(e){}
  try{audioCtx?.close();}catch(e){}
  stream=null;audioCtx=null;analyser=null;raf=0;
}
function cleanupRecorder(){mediaRecorder=null;chunks=[];}
function finishNoSpeech(){
  setListening(false);stopTracks();cleanupRecorder();setStatus('Voice ready');
  transcriptEl.textContent='No speech heard. Click the microphone and try again.';
  post('TF_VOICE_NO_SPEECH');
}
function sendRecordedAudio(blob,type){
  if(!blob||!blob.size){finishNoSpeech();return;}
  const r=new FileReader();
  r.onloadend=()=>{
    setStatus('Sending voice to Gemini…');
    hintEl.textContent='Processing your voice answer…';
    transcriptEl.textContent='Voice captured · '+Math.max(1,Math.round(blob.size/1024))+' KB';
    post('TF_VOICE_AUDIO',{audioDataUrl:r.result,mimeType:type||blob.type||'audio/webm'});
  };
  r.onerror=()=>{
    const m='Recorded audio could not be read.';setStatus('Voice error','bad');hintEl.textContent=m;post('TF_VOICE_ERROR',{message:m});
  };
  r.readAsDataURL(blob);
}
function stopCapture(send=true){
  if(!listening && !(mediaRecorder&&mediaRecorder.state==='recording'))return;
  setListening(false);clearTimeout(stopTimer);cancelAnimationFrame(raf);
  try{
    if(mediaRecorder&&mediaRecorder.state==='recording'){
      mediaRecorder._send=!!send;
      mediaRecorder.stop();
      return;
    }
  }catch(e){}
  stopTracks();
}
function monitorLevel(){
  if(!listening||!analyser)return;
  const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);
  let sum=0;for(let i=0;i<data.length;i++){const x=(data[i]-128)/128;sum+=x*x;}
  const rms=Math.sqrt(sum/data.length),now=Date.now();
  // intentionally conservative threshold so ordinary laptop mics trigger reliably
  if(rms>.008){
    speechSeen=true;lastSound=now;hasLevel=true;
    const pct=Math.min(100,Math.max(4,Math.round(rms*900)));
    transcriptEl.textContent='Listening… microphone level '+pct+'%';
  }
  if(speechSeen && now-lastSound>1600 && now-started>1200){stopCapture(true);return;}
  if(now-started>18000){stopCapture(true);return;}
  raf=requestAnimationFrame(monitorLevel);
}
async function startCapture(){
  if(listening)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
    const m='This Chrome session does not support direct microphone recording.';setStatus('Voice error','bad');hintEl.textContent=m;post('TF_VOICE_ERROR',{message:m});return;
  }
  try{
    setStatus('Opening microphone…');hintEl.textContent='Allow microphone access if Chrome asks.';transcriptEl.textContent='Starting microphone…';
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const tracks=stream.getAudioTracks();
    if(!tracks.length)throw new Error('No audio track was returned by Chrome.');
    const settings=tracks[0].getSettings?tracks[0].getSettings():{};
    chunks=[];speechSeen=false;hasLevel=false;started=lastSound=Date.now();
    const mime=mediaMime();
    mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mediaRecorder._send=true;
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mediaRecorder.onerror=e=>{const m=errMessage(e?.error||e);setListening(false);stopTracks();setStatus('Voice error','bad');hintEl.textContent=m;post('TF_VOICE_ERROR',{message:m});};
    mediaRecorder.onstop=()=>{
      const send=mediaRecorder?mediaRecorder._send!==false:true;
      const type=(mediaRecorder&&mediaRecorder.mimeType)||chunks[0]?.type||'audio/webm';
      const blob=new Blob(chunks,{type});
      stopTracks();cleanupRecorder();setListening(false);
      if(!send){setStatus('Voice ready');return;}
      // Even if the level monitor did not detect speech, send a non-trivial recording.
      // Gemini can decide whether usable speech is present much more reliably than an RMS gate.
      if(blob.size<1200){finishNoSpeech();return;}
      sendRecordedAudio(blob,type);
    };
    mediaRecorder.start(250);
    armed=true;setListening(true);setStatus('Listening…');
    hintEl.textContent='Speak now. I will stop automatically after you finish.';
    transcriptEl.textContent='Listening…';
    post('TF_VOICE_ARMED',{armed:true,listening:true});post('TF_VOICE_LISTENING');
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        audioCtx=new AC();
        if(audioCtx.state==='suspended')await audioCtx.resume();
        const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);monitorLevel();
      }
    }catch(e){
      // Recorder still works even if AudioContext metering is unavailable.
    }
    stopTimer=setTimeout(()=>{if(listening)stopCapture(true);},12000);
    const label=settings.deviceId?'Microphone connected':'Microphone connected';
    transcriptEl.textContent=label+' · speak now';
  }catch(e){
    setListening(false);stopTracks();cleanupRecorder();
    const m=errMessage(e);setStatus('Voice error','bad');hintEl.textContent=m;transcriptEl.textContent=m;post('TF_VOICE_ERROR',{message:m});
  }
}

enable.onclick=()=>{armed=true;if(listening)stopCapture(true);else startCapture();};
mic.onclick=()=>{armed=true;if(listening)stopCapture(true);else startCapture();};
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.token!==token)return;if(e.source!==window.opener)return;
  if(d.type==='TF_VOICE_START'){
    if(listening)return;
    if(!armed){setStatus('Enable microphone once');hintEl.textContent='Click “Enable voice” once. After that, Trade Finance can listen hands-free.';try{window.focus();}catch(_e){}return;}
    startCapture();
  }else if(d.type==='TF_VOICE_STOP')stopCapture(!!d.send);
});
window.addEventListener('beforeunload',()=>{post('TF_VOICE_CLOSED');stopCapture(false);stopTracks();});
if(!window.opener){
  setStatus('Standalone microphone test');
  hintEl.textContent='Click “Enable voice” to test recording. For hands-free Trade Finance use, open this page from the Gemini microphone button.';
}else{
  setStatus('Connected · enable microphone once');post('TF_VOICE_READY',{armed:false});
}
})();
</script>
</body>
</html>
