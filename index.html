<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Finance Voice Bridge</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);background:#fff;border:1px solid #d9e0e8;border-radius:16px;box-shadow:0 18px 45px rgba(16,24,40,.12);overflow:hidden}.head{padding:17px 18px 14px;border-bottom:1px solid #e6ebf0}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:#667085;font-size:11px;letter-spacing:.04em}.body{padding:18px}.status{padding:10px 12px;border-radius:10px;background:#eef5fb;color:#1f4566;font-size:12px;font-weight:700;margin-bottom:14px}.mic{width:92px;height:92px;border-radius:50%;border:0;background:#1f4566;color:#fff;font-size:34px;display:block;margin:20px auto 12px;cursor:pointer;box-shadow:0 8px 24px rgba(31,69,102,.25)}.mic.listening{background:#b8402a;animation:pulse 1.15s infinite}.mic:disabled{opacity:.45;cursor:not-allowed}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(184,64,42,.10)}}.primary{width:100%;border:0;border-radius:9px;background:#1f4566;color:#fff;padding:11px 14px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5}.hint{text-align:center;color:#667085;font-size:12px;line-height:1.5;min-height:38px}.transcript{margin-top:14px;padding:12px;border:1px solid #e4e8ee;border-radius:10px;background:#fafbfc;min-height:62px;font-size:13px;color:#344054;line-height:1.45}.foot{padding:11px 18px;border-top:1px solid #e6ebf0;color:#667085;font-size:10.5px}.ok{color:#087a55}.bad{color:#b42318}
</style>
</head>
<body>
<div class="card">
  <div class="head"><b>Trade Finance Voice Bridge</b><small>MICROPHONE FOR GEMINI ASSISTANT</small></div>
  <div class="body">
    <div id="status" class="status">Connecting to Trade Finance…</div>
    <button id="mic" class="mic" type="button" aria-label="Enable or stop voice">🎙️</button>
    <button id="enable" class="primary" type="button">Enable voice</button>
    <div id="hint" class="hint">Keep this small window open while using the Gemini assistant.</div>
    <div id="transcript" class="transcript">No speech yet.</div>
  </div>
  <div class="foot">Your voice is used only for the active Trade Finance assistant session.</div>
</div>
<script>
(function(){
'use strict';
const q=new URLSearchParams(location.search), token=q.get('tfVoiceToken')||'', lang=q.get('lang')||'en-IN';
const statusEl=document.getElementById('status'), hintEl=document.getElementById('hint'), transcriptEl=document.getElementById('transcript'), mic=document.getElementById('mic'), enable=document.getElementById('enable');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let armed=false,listening=false,recognition=null,finalText='',interimText='',requestedStart=false;
let mediaRecorder=null,stream=null,chunks=[],audioCtx=null,analyser=null,raf=0,speechSeen=false,lastSound=0,started=0;
function post(type,extra){try{if(window.opener&&!window.opener.closed)window.opener.postMessage(Object.assign({type,token},extra||{}),'*');}catch(e){}}
function setStatus(t,cls){statusEl.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
function setListening(on){listening=!!on;mic.classList.toggle('listening',listening);mic.textContent=listening?'■':'🎙️';enable.textContent=armed?(listening?'Stop listening':'Voice enabled'):'Enable voice';enable.disabled=armed&&!listening;}
function showText(){const t=(interimText||finalText||'').trim();transcriptEl.textContent=t||'No speech yet.';if(t)post('TF_VOICE_INTERIM',{text:t});}
function errMessage(e){const code=String(e?.error||e?.name||'');const msg=String(e?.message||'');if(/not-allowed|service-not-allowed|NotAllowed/i.test(code+msg))return 'Microphone permission was denied. Allow microphone access for this Voice Bridge page and try again.';if(/audio-capture|NotFound/i.test(code+msg))return 'No working microphone was found.';if(/network/i.test(code+msg))return 'Chrome speech recognition could not reach its speech service. Try again or check your network.';return msg||code||'Voice capture failed.';}
function stopTracks(){try{stream?.getTracks().forEach(t=>t.stop());}catch(e){}try{audioCtx?.close();}catch(e){}cancelAnimationFrame(raf);stream=null;audioCtx=null;analyser=null;}
function finishNoSpeech(){setListening(false);setStatus('Voice ready');post('TF_VOICE_NO_SPEECH');}
function startSpeechRecognition(){
  if(!SR)return false;
  try{
    recognition=new SR();finalText='';interimText='';recognition.lang=lang;recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;
    recognition.onstart=()=>{armed=true;setListening(true);setStatus('Listening…');hintEl.textContent='Speak naturally. The recognized words will return to Trade Finance.';post('TF_VOICE_ARMED',{armed:true,listening:true});post('TF_VOICE_LISTENING');};
    recognition.onresult=e=>{let fin=finalText,inter='';for(let i=e.resultIndex;i<e.results.length;i++){const t=String(e.results[i][0]?.transcript||'').trim();if(!t)continue;if(e.results[i].isFinal)fin+=(fin?' ':'')+t;else inter+=(inter?' ':'')+t;}finalText=fin.trim();interimText=inter.trim();showText();};
    recognition.onerror=e=>{if(e.error==='no-speech'){finishNoSpeech();return;}setListening(false);const m=errMessage(e);setStatus('Voice error','bad');hintEl.textContent=m;post('TF_VOICE_ERROR',{message:m});};
    recognition.onend=()=>{setListening(false);const t=String(finalText||interimText||'').trim();recognition=null;if(t){setStatus('Sending to Trade Finance…');post('TF_VOICE_TEXT',{text:t});finalText='';interimText='';}else if(armed){finishNoSpeech();}};
    recognition.start();return true;
  }catch(e){recognition=null;return false;}
}
function mediaMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];return window.MediaRecorder&&MediaRecorder.isTypeSupported?c.find(x=>MediaRecorder.isTypeSupported(x))||'':'';}
async function startMediaFallback(){
  try{
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('This browser does not support microphone recording.');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];speechSeen=false;started=lastSound=Date.now();const mime=mediaMime();mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};mediaRecorder.onerror=e=>{const m=errMessage(e?.error||e);setStatus('Voice error','bad');hintEl.textContent=m;post('TF_VOICE_ERROR',{message:m});};
    mediaRecorder.onstop=()=>{setListening(false);stopTracks();if(!chunks.length){finishNoSpeech();return;}const type=mediaRecorder?.mimeType||chunks[0]?.type||'audio/webm',blob=new Blob(chunks,{type}),r=new FileReader();r.onloadend=()=>{setStatus('Sending audio to Trade Finance…');post('TF_VOICE_AUDIO',{audioDataUrl:r.result,mimeType:type});};r.onerror=()=>post('TF_VOICE_ERROR',{message:'Recorded audio could not be read.'});r.readAsDataURL(blob);};
    mediaRecorder.start(250);armed=true;setListening(true);setStatus('Listening…');post('TF_VOICE_ARMED',{armed:true,listening:true});post('TF_VOICE_LISTENING');
    try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioCtx=new AC();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);const data=new Uint8Array(analyser.fftSize);const monitor=()=>{if(!listening||!analyser)return;analyser.getByteTimeDomainData(data);let sum=0;for(let i=0;i<data.length;i++){const x=(data[i]-128)/128;sum+=x*x;}const rms=Math.sqrt(sum/data.length),now=Date.now();if(rms>.018){speechSeen=true;lastSound=now;}if(speechSeen&&now-lastSound>1400&&now-started>1000){stopCapture(true);return;}if(now-started>20000){stopCapture(true);return;}raf=requestAnimationFrame(monitor);};monitor();}}
    catch(e){setTimeout(()=>{if(listening)stopCapture(true);},12000);}
  }catch(e){const m=errMessage(e);setStatus('Voice error','bad');hintEl.textContent=m;post('TF_VOICE_ERROR',{message:m});}
}
async function startCapture(){if(listening)return;requestedStart=false;setStatus('Starting microphone…');if(startSpeechRecognition())return;await startMediaFallback();}
function stopCapture(send){if(!listening)return;setListening(false);try{if(recognition){send?recognition.stop():recognition.abort();return;}}catch(e){}try{if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();}catch(e){stopTracks();} }
enable.onclick=()=>{armed=true;startCapture();};mic.onclick=()=>{if(listening)stopCapture(true);else startCapture();};
window.addEventListener('message',e=>{const d=e.data;if(!d||d.token!==token)return;if(e.source!==window.opener)return;if(d.type==='TF_VOICE_START'){if(listening)return;if(!armed){requestedStart=true;setStatus('Enable microphone once');hintEl.textContent='Click “Enable voice” once. After that, Trade Finance can listen hands-free.';try{window.focus();}catch(_e){}return;}startCapture();}else if(d.type==='TF_VOICE_STOP'){stopCapture(!!d.send);}});
window.addEventListener('beforeunload',()=>{post('TF_VOICE_CLOSED');stopCapture(false);stopTracks();});
if(!window.opener){setStatus('Open this page from Trade Finance','bad');enable.disabled=true;mic.disabled=true;hintEl.textContent='This Voice Bridge must be opened by the Gemini button inside Trade Finance.';}else{setStatus('Connected · enable microphone once');post('TF_VOICE_READY',{armed:false});}
})();
</script>
</body>
</html>
